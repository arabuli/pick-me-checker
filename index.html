<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Group Chat Pick-Me Checker</title>
    <style>
        :root {
            --bg-color: #121212;
            --panel-bg: #1e1e1e;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --accent-primary: #8b5cf6;
            --accent-hover: #7c3aed;
            --ana-red: #ef4444;
            --mariam-soft: #ec4899;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 1rem;
            min-height: 100vh;
            transition: background-color 0.5s ease;
        }

        .container {
            max-width: 800px;
            width: 100%;
            background: var(--panel-bg);
            padding: 2rem;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        h1 {
            text-align: center;
            margin-bottom: 0.5rem;
            font-size: 2rem;
            background: linear-gradient(to right, #8b5cf6, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.subtitle {
            text-align: center;
            color: var(--text-muted);
            margin-bottom: 2rem;
        }

        textarea {
            width: 100%;
            height: 120px;
            background: #2a2a2a;
            border: 1px solid #3f3f46;
            border-radius: 12px;
            padding: 1rem;
            color: white;
            font-size: 1rem;
            resize: none;
            margin-bottom: 1rem;
        }

        textarea:focus {
            outline: none;
            border-color: var(--accent-primary);
        }

        button {
            width: 100%;
            padding: 1rem;
            border: none;
            border-radius: 12px;
            background: var(--accent-primary);
            color: white;
            font-weight: bold;
            font-size: 1.1rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background: var(--accent-hover);
        }

        button:disabled {
            background: #4b5563;
            cursor: not-allowed;
        }

        #loading-text {
            text-align: center;
            margin-top: 1rem;
            font-style: italic;
            color: var(--accent-primary);
            display: none;
        }

        #results {
            display: none;
            margin-top: 2rem;
        }

        .verdict-box {
            background: #2a2a2a;
            padding: 1.5rem;
            border-radius: 12px;
            margin-bottom: 2rem;
            text-align: center;
        }

        .verdict-title {
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 1rem;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1.5rem;
        }

        .friend-card {
            background: #2a2a2a;
            padding: 1.5rem;
            border-radius: 12px;
            border-left: 4px solid var(--accent-primary);
        }

        .friend-card.ana-alert {
            border-left-color: var(--ana-red);
            animation: pulse-red 2s infinite;
        }
        
        .friend-card.mariam-card {
            border-left-color: var(--mariam-soft);
        }

        @keyframes pulse-red {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        .friend-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .friend-name {
            font-weight: bold;
            font-size: 1.2rem;
        }

        .percentage {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--accent-primary);
        }
        
        .mariam-card .percentage {
            color: var(--mariam-soft);
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: #3f3f46;
            border-radius: 4px;
            margin-bottom: 1rem;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: var(--accent-primary);
            width: 0%;
            transition: width 1s ease-out;
        }

        .ana-alert .progress-fill { background: var(--ana-red); }
        .mariam-card .progress-fill { background: var(--mariam-soft); }

        .analysis-text {
            font-size: 0.95rem;
            line-height: 1.5;
            color: #d1d5db;
        }

        .red-flag-bg {
            background-color: #450a0a !important;
        }

        #share-btn {
            background: #2563eb;
            margin-top: 2rem;
            display: none;
        }
        
        #share-btn:hover { background: #1d4ed8; }
    </style>
</head>
<body>

    <div class="container">
        <h1>The Pick-Me Checker</h1>
        <p class="subtitle">Will the group chat judge you? Let's find out.</p>

        <textarea id="input-text" placeholder="Paste the suspicious sentence here (English, Georgian, or German)..."></textarea>
        <button id="analyze-btn" onclick="runAnalysis()">Judge This Sentence</button>
        <div id="loading-text">Consulting the group chat...</div>

        <div id="results">
            <div class="verdict-box">
                <div class="verdict-title" id="main-verdict">100% Pick-Me</div>
                <p class="analysis-text" id="general-consensus">Loading consensus...</p>
            </div>

            <div class="grid">
                <!-- Saba -->
                <div class="friend-card" id="card-saba">
                    <div class="friend-header">
                        <span class="friend-name">Saba 🧔🏻‍♂️</span>
                        <span class="percentage" id="score-saba">0%</span>
                    </div>
                    <div class="progress-bar"><div class="progress-fill" id="bar-saba"></div></div>
                    <p class="analysis-text" id="text-saba">...</p>
                </div>

                <!-- Ana -->
                <div class="friend-card" id="card-ana">
                    <div class="friend-header">
                        <span class="friend-name">Ana 💅</span>
                        <span class="percentage" id="score-ana" style="color: var(--ana-red);">0%</span>
                    </div>
                    <div class="progress-bar"><div class="progress-fill" id="bar-ana" style="background: var(--ana-red);"></div></div>
                    <p class="analysis-text" id="text-ana">...</p>
                </div>

                <!-- Mari -->
                <div class="friend-card" id="card-mari">
                    <div class="friend-header">
                        <span class="friend-name">Mari 🎧</span>
                        <span class="percentage" id="score-mari">0%</span>
                    </div>
                    <div class="progress-bar"><div class="progress-fill" id="bar-mari"></div></div>
                    <p class="analysis-text" id="text-mari">...</p>
                </div>

                <!-- Mariam -->
                <div class="friend-card mariam-card" id="card-mariam">
                    <div class="friend-header">
                        <span class="friend-name">Mariam ❤️</span>
                        <span class="percentage" id="score-mariam">0%</span>
                    </div>
                    <div class="progress-bar"><div class="progress-fill" id="bar-mariam"></div></div>
                    <p class="analysis-text" id="text-mariam">...</p>
                </div>
            </div>
            
            <button id="share-btn" onclick="copyToClipboard()">📋 Copy Verdict for the Group Chat</button>
        </div>
    </div>

    <script>
        // --- PUT YOUR API KEY HERE ---
        const apiKey = 'AIzaSyAKIFgi0XA-YER25lLDgEB_JqI5vyNwFa8'; 

        const chaoticLoaders = [
            "Consulting the group chat...",
            "Measuring your try-hard energy...",
            "Checking if this is performative...",
            "Translating your vibes for Ana...",
            "Asking Mariam for her thoughtful take 🥰...",
            "Saba is already typing a paragraph..."
        ];

        const snarkyErrors = [
            "Ana left the chat. Try again.",
            "Saba is too busy gatekeeping Linux right now. Try again.",
            "Mari thinks this error is performative.",
            "Mariam is patiently waiting for the server to wake up 🌸. Try again."
        ];

        let loadingInterval;
        let globalResults = {};

        async function runAnalysis() {
            const input = document.getElementById('input-text').value.trim().toLowerCase();
            if (!input) return;

            // UI Reset
            document.getElementById('results').style.display = 'none';
            document.getElementById('share-btn').style.display = 'none';
            document.body.classList.remove('red-flag-bg');
            document.getElementById('card-ana').classList.remove('ana-alert');
            
            const btn = document.getElementById('analyze-btn');
            const loader = document.getElementById('loading-text');
            btn.disabled = true;
            loader.style.display = 'block';

            // Chaotic Loading animation
            let loadIndex = 0;
            loader.innerText = chaoticLoaders[0];
            loadingInterval = setInterval(() => {
                loadIndex = (loadIndex + 1) % chaoticLoaders.length;
                loader.innerText = chaoticLoaders[loadIndex];
            }, 2000);

            // EASTER EGG OVERRIDE: Check for specific personal triggers
            if (input.includes("linux") || input.includes("kubuntu") || input.includes("bouldering")) {
                clearInterval(loadingInterval);
                setTimeout(() => applyResults({
                    verdict: "100% Pick-Me (Beka Edition)",
                    general: "Let me guess... you're skipping the party to go bouldering or install a new Linux distro?",
                    saba: { score: 100, text: "Unprompted superiority detected. Major early-adopter gatekeeping energy." },
                    ana: { score: 50, text: "Not morphing your identity, but definitely forcing a personality." },
                    mari: { score: 90, text: "Incredibly try-hard. We get it, you use the terminal." },
                    mariam: { score: 20, text: "Society didn't make you do this, you just really like your hobbies and that's okay ❤️." }
                }), 1500);
                return;
            }

            // Gemini API Call
            const prompt = `Analyze this sentence for "Pick-Me" behavior.
            Sentence: "${input}"
            
            Return ONLY a valid JSON object matching this exact structure:
            {
                "verdict": "Short title (e.g. '100% Pick-Me', 'Not a Pick-Me', 'Tragic Pick-Me')",
                "general": "Brief explanation of general consensus.",
                "saba": { "score": number 0-100, "text": "Analysis based on performative validation/hipster gatekeeping" },
                "ana": { "score": number 0-100, "text": "Analysis based on identity morphing/red flags" },
                "mari": { "score": number 0-100, "text": "Analysis based on forced effort/try-hard" },
                "mariam": { "score": number 0-100, "text": "Analysis based on societal conditioning. Be sweet/respectful, frame it as systemic." }
            }`;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }] }],
                        generationConfig: { response_mime_type: "application/json" }
                    })
                });

                const data = await response.json();
                const resultText = data.candidates[0].content.parts[0].text;
                const parsedResult = JSON.parse(resultText);
                
                clearInterval(loadingInterval);
                applyResults(parsedResult);

            } catch (error) {
                clearInterval(loadingInterval);
                const randomError = snarkyErrors[Math.floor(Math.random() * snarkyErrors.length)];
                loader.innerText = randomError;
                btn.disabled = false;
            }
        }

        function applyResults(data) {
            globalResults = data;
            
            document.getElementById('main-verdict').innerText = data.verdict;
            document.getElementById('general-consensus').innerText = data.general;

            const friends = ['saba', 'ana', 'mari', 'mariam'];
            friends.forEach(friend => {
                document.getElementById(`score-${friend}`).innerText = `${data[friend].score}%`;
                document.getElementById(`text-${friend}`).innerText = data[friend].text;
                
                // Animate progress bars
                setTimeout(() => {
                    document.getElementById(`bar-${friend}`).style.width = `${data[friend].score}%`;
                }, 100);
            });

            // Dynamic UI: Ana's Red Flag Warning
            if (data.ana.score >= 80) {
                document.body.classList.add('red-flag-bg');
                document.getElementById('card-ana').classList.add('ana-alert');
            }

            document.getElementById('loading-text').style.display = 'none';
            document.getElementById('results').style.display = 'block';
            document.getElementById('share-btn').style.display = 'block';
            document.getElementById('analyze-btn').disabled = false;
        }

        function copyToClipboard() {
            const text = `🚨 Group Chat Verdict: ${globalResults.verdict} 🚨\nSaba: ${globalResults.saba.score}% | Ana: ${globalResults.ana.score}% | Mari: ${globalResults.mari.score}% | Mariam: ${globalResults.mariam.score}%\n\nAna says: "${globalResults.ana.text}"`;
            
            navigator.clipboard.writeText(text).then(() => {
                const btn = document.getElementById('share-btn');
                btn.innerText = "✅ Copied to clipboard!";
                setTimeout(() => { btn.innerText = "📋 Copy Verdict for the Group Chat"; }, 2000);
            });
        }
    </script>
</body>
</html>
